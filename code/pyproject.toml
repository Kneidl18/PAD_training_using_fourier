[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "image_processing"
version = "1.0.0"
description = "Image Processing - Fourier Extraction"
authors = [
  { name = "Andreas Auer", email = "andreas.auer@stud.plus.ac.at" },
  { name = "Philipp Fuchs", email = "philipp.fuchs@stud.plus.ac.at" },
  { name = "Sarah Götz", email = "sarah.goetz@stud.plus.ac.at" }
]
requires-python = ">=3.8"

dependencies = [
  "opencv-python-headless",
  "scikit-learn",
  "numpy",
  "matplotlib",
  "seaborn",
  "scikit-image",
  "scipy",
  "dotenv",
  "tqdm"
]

[tool.setuptools]
packages = ["src"] 

[project.scripts]
core_main = "src.main:main"
